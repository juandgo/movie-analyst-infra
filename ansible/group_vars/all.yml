aws_region: us-east-2
ssm_prefix: "/{{ env_name }}"

app_user: app
node_bin: /usr/bin/node
nodejs_packages:
  - nodejs20
  - nodejs20-npm

# Application source: your fork of devops-rampup (both components live in one repo)
app_repo_url: https://github.com/juandgo/devops-rampup.git
app_repo_version: master
app_src_dir: /opt/devops-rampup
